#########################################
# 🧭 Proxy Inverso HTTP - MinaAMP
# Servidor central: 192.168.0.11
# Tráfico sólo por HTTP
#########################################

# Frontend Quasar - Movilización
server {
    listen 80;
    server_name movilizacion.minaamp.gob.ve;
    location / {
        proxy_pass http://192.168.0.32:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

