    error_log /var/log/nginx/recuperacion_error.log;
}

#########################################
# Configuración Nginx - certificacion.minaamp.gob.ve
# Servidor: 192.168.0.11
# Backend: 192.168.0.32:3100
#########################################

# Redirigir HTTP a HTTPS
server {
    listen 80;
    server_name certificacion.minaamp.gob.ve;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name certificacion.minaamp.gob.ve;

    ssl_certificate /etc/letsencrypt/live/certificacion.minaamp.gob.ve/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/certificacion.minaamp.gob.ve/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://192.168.0.32:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /ws {
        proxy_pass http://192.168.0.32:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 86400s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://192.168.0.32:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

#########################################
# Configuración Nginx - directorio.minaamp.gob.ve
# Servidor: 192.168.0.11
# Frontend: 192.168.0.32:5000
# Backend API: 192.168.0.32:4000
# Auth API: 192.168.0.32:4001
#########################################

# HTTP - Redirigir a HTTPS
server {
    listen 80;
    server_name directorio.minaamp.gob.ve;
    return 301 https://$host$request_uri;
}

# HTTPS - directorio.minaamp.gob.ve (TODO EN UN SOLO DOMINIO)
server {
    listen 443 ssl;
    server_name directorio.minaamp.gob.ve;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/directorio.minaamp.gob.ve/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/directorio.minaamp.gob.ve/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ============================================
    # Backend API - /api/
    # Proxea a 192.168.0.32:4000
    # ============================================
    location /api/ {
        # La barra final en proxy_pass elimina /api/ del path enviado al backend
        proxy_pass http://192.168.0.32:4000/;
        proxy_http_version 1.1;

        # Headers estándar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte WebSocket (para conexiones upgrade dentro de /api/)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts largos para WebSocket
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60;

        proxy_buffering off;
    }

    # ============================================
    # Auth API - /auth/
    # Proxea a 192.168.0.32:4001
    # ============================================
    location /auth/ {
        # Mantiene /auth/ en el path porque el backend lo espera
        proxy_pass http://192.168.0.32:4001;
        proxy_http_version 1.1;

        # Headers estándar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # ============================================
    # WebSocket dedicado - /ws
    # Proxea a 192.168.0.32:4000
    # ============================================
    location /ws {
        proxy_pass http://192.168.0.32:4000;
        proxy_http_version 1.1;

        # Headers necesarios para WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts largos para mantener conexión WebSocket abierta
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 86400s;

        # Deshabilitar buffering para WebSocket
        proxy_buffering off;
    }

    # ============================================
    # Frontend Quasar - / (todo lo demás)
    # Proxea a 192.168.0.32:5000
    # ============================================
    location / {
        proxy_pass http://192.168.0.32:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # Logs
    access_log /var/log/nginx/directorio_access.log;
    error_log /var/log/nginx/directorio_error.log;
}

# ============================================
# NOTA: Los siguientes bloques de subdominios
# (backdirectorio y authdirectorio) ya no son
# necesarios si usas rutas /api/ y /auth/
# pero los dejamos por si necesitas HTTP legacy
# ============================================

# Backend HTTP legacy - backdirectorio (solo HTTP, sin SSL)
server {
    listen 80;
    server_name backdirectorio.minaamp.gob.ve;
    
    location / {
        proxy_pass http://192.168.0.32:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    access_log /var/log/nginx/backdirectorio_access.log;
    error_log /var/log/nginx/backdirectorio_error.log;
}

# Auth HTTP legacy - authdirectorio (solo HTTP, sin SSL)
server {
    listen 80;
    server_name authdirectorio.minaamp.gob.ve;

    location /auth/ {
        proxy_pass http://192.168.0.32:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
